<aside class="h-screen w-72 left-0 top-0 fixed bg-surface-container-low flex flex-col p-6 z-50">
  <div class="text-xl font-black text-primary font-headline mb-8">Mindful Atelier</div>

  <div class="mb-10">
    <p class="font-body text-sm tracking-wide font-medium text-primary uppercase opacity-60 mb-2">The Workspace</p>
    <h2 class="font-headline font-bold text-xl text-primary">Curated Focus</h2>
  </div>

  <nav class="flex-grow relative">
    <!-- Sliding active pill -->
    <div
      #navPill
      class="absolute left-0 right-0 h-11 rounded-xl bg-surface-container-lowest shadow-sm"
      style="top: 0; pointer-events: none;"
    ></div>

    <div class="relative space-y-2" #navList>
      @for (item of navItems; track item.route) {
        <a
          #navItemEl
          [routerLink]="item.route"
          routerLinkActive="text-primary font-bold"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-on-surface opacity-60
                 hover:opacity-100 transition-opacity duration-200 relative z-10"
          (mouseenter)="onNavHoverIn($event)"
          (mouseleave)="onNavHoverOut($event)"
        >
          <span class="material-symbols-outlined nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span class="font-body text-sm tracking-wide font-medium nav-label">{{ item.label }}</span>
        </a>
      }
    </div>
  </nav>

  <button
    #startWeekBtn
    class="mt-4 w-full py-3 px-4 bg-primary text-on-primary rounded-full font-bold text-sm tracking-wide relative overflow-hidden"
    (mouseenter)="onStartWeekHover()"
    (mouseleave)="onStartWeekHoverOut()"
    (click)="onStartWeekClick()"
  >
    <span
      class="absolute inset-0 rounded-full pointer-events-none"
      style="background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%); background-size: 200% 100%; background-position: -200% 0;"
      #shimmerEl
    ></span>
    <span class="relative z-10">Start Week</span>
  </button>

  <div class="mt-auto pt-6 space-y-2">
    <button class="flex items-center gap-3 px-4 py-2 text-on-surface opacity-60 hover:opacity-100 transition-all w-full">
      <span class="material-symbols-outlined" aria-hidden="true">settings</span>
      <span class="font-body text-sm font-medium">Settings</span>
    </button>
    <button class="flex items-center gap-3 px-4 py-2 text-on-surface opacity-60 hover:opacity-100 transition-all w-full">
      <span class="material-symbols-outlined" aria-hidden="true">help_outline</span>
      <span class="font-body text-sm font-medium">Help</span>
    </button>
  </div>
</aside>
